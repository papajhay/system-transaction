# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    transfer.search_filter:
        parent: 'api_platform.doctrine.orm.search_filter'
        arguments:
            $properties:
                token: exact
                reference: partial
                senderAccount: exact
                receiverAccount: exact
                currency: exact
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    transfer.enum_filter:
        parent: 'api_platform.doctrine.orm.backed_enum_filter'
        arguments:
            $properties:
                type: ~
                status: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    transfer.order_filter:
        parent: 'api_platform.doctrine.orm.order_filter'
        arguments:
            $properties:
                amount: ~
                reference: ~
                createdAt: ~
                expiresAt: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    transfer.date_filter:
        parent: 'api_platform.doctrine.orm.date_filter'
        arguments:
            $properties:
                processedAt: ~
                expiresAt: ~
                createdAt: ~
                updatedAt: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    operation.search_filter:
        parent: 'api_platform.doctrine.orm.search_filter'
        arguments:
            $properties:
                account: exact
                transfer: exact
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    operation.enum_filter:
        parent: 'api_platform.doctrine.orm.backed_enum_filter'
        arguments:
            $properties:
                type: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    operation.order_filter:
        parent: 'api_platform.doctrine.orm.order_filter'
        arguments:
            $properties:
                amount: ~
                balanceBefore: ~
                balanceAfter: ~
                createdAt: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    operation.date_filter:
        parent: 'api_platform.doctrine.orm.date_filter'
        arguments:
            $properties:
                createdAt: ~
                updatedAt: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
