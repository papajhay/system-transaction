# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    exchange_rates_api_url: '%env(EXCHANGE_RATES_API_URL)%'
    exchange_rates_api_key: '%env(EXCHANGE_RATES_API_KEY)%'
    # Applied only to legacy transfers with no persisted/global fee configuration.
    # It is represented and persisted as a percentage fee, never as a fixed fee.
    transfer_default_fee_rate: 10.0
    pending_transfer_threshold_seconds: '%env(int:TRANSFER_PENDING_THRESHOLD_SECONDS)%'
    pending_transfer_alert_recipients: '%env(string:PENDING_TRANSFER_ALERT_RECIPIENTS)%'
    pending_transfer_alert_cooldown_seconds: '%env(int:PENDING_TRANSFER_ALERT_COOLDOWN_SECONDS)%'
    daily_report_output_directory: '%env(string:REPORT_OUTPUT_DIRECTORY)%'
    daily_report_timezone: '%env(string:REPORT_TIMEZONE)%'
    daily_report_time: '%env(string:DAILY_REPORT_TIME)%'
    report_from_address: '%env(string:REPORT_FROM_ADDRESS)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\ExchangeRateProvider:
        arguments:
            $apiUrl: '%exchange_rates_api_url%'
            $apiKey: '%exchange_rates_api_key%'

    App\Service\FeeCalculator:
        arguments:
            $legacyTransferDefaultRate: '%transfer_default_fee_rate%'

    App\Service\TransferExecutionDelay: '@App\Service\NativeTransferExecutionDelay'

    App\Service\PendingTransferMonitor:
        arguments:
            $thresholdSeconds: '%pending_transfer_threshold_seconds%'

    App\Service\PendingTransferAutoExecutor:
        arguments:
            $depositExecutor: '@App\Service\DepositExecutor'
            $withdrawalExecutor: '@App\Service\WithdrawalExecutor'
            $transferExecutor: '@App\Service\TransferExecutor'

    App\Service\PendingTransferAlertService:
        arguments:
            $recipients: '%pending_transfer_alert_recipients%'
            $fromAddress: '%report_from_address%'
            $cooldownSeconds: '%pending_transfer_alert_cooldown_seconds%'

    App\Service\DailyTransactionReportGenerator:
        arguments:
            $timezone: '%daily_report_timezone%'

    App\Service\DailyTransactionReportWriter:
        arguments:
            $projectDirectory: '%kernel.project_dir%'
            $outputDirectory: '%daily_report_output_directory%'
            $timezone: '%daily_report_timezone%'

    App\MessageHandler\GenerateDailyTransactionReportMessageHandler:
        arguments:
            $timezone: '%daily_report_timezone%'

    App\Scheduler\PendingTransferScheduleProvider:
        arguments:
            $dailyReportTime: '%daily_report_time%'
            $timezone: '%daily_report_timezone%'

    transfer.search_filter:
        parent: 'api_platform.doctrine.orm.search_filter'
        arguments:
            $properties:
                token: exact
                reference: partial
                senderAccount: exact
                receiverAccount: exact
                currency: exact
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    transfer.enum_filter:
        parent: 'api_platform.doctrine.orm.backed_enum_filter'
        arguments:
            $properties:
                type: ~
                status: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    transfer.order_filter:
        parent: 'api_platform.doctrine.orm.order_filter'
        arguments:
            $properties:
                amount: ~
                reference: ~
                createdAt: ~
                expiresAt: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    transfer.date_filter:
        parent: 'api_platform.doctrine.orm.date_filter'
        arguments:
            $properties:
                processedAt: ~
                expiresAt: ~
                createdAt: ~
                updatedAt: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    operation.search_filter:
        parent: 'api_platform.doctrine.orm.search_filter'
        arguments:
            $properties:
                account: exact
                transfer: exact
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    operation.enum_filter:
        parent: 'api_platform.doctrine.orm.backed_enum_filter'
        arguments:
            $properties:
                type: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    operation.order_filter:
        parent: 'api_platform.doctrine.orm.order_filter'
        arguments:
            $properties:
                amount: ~
                balanceBefore: ~
                balanceAfter: ~
                createdAt: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    operation.date_filter:
        parent: 'api_platform.doctrine.orm.date_filter'
        arguments:
            $properties:
                createdAt: ~
                updatedAt: ~
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false
        public: false

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
