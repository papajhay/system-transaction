resources:
    App\Entity\Transfer:
        operations:
            ApiPlatform\Metadata\Get: {}
            ApiPlatform\Metadata\GetCollection:
                filters:
                    - transfer.search_filter
                    - transfer.enum_filter
                    - transfer.order_filter
                    - transfer.date_filter
            ApiPlatform\Metadata\Post: {}
            ApiPlatform\Metadata\Put: {}
            ApiPlatform\Metadata\Patch: {}
            ApiPlatform\Metadata\Delete: {}
            init_deposit:
                class: ApiPlatform\Metadata\Post
                uriTemplate: /transactions/init-deposit
                input: App\Dto\InitDepositInput
                output: App\Dto\TransactionResponse
                processor: App\State\DepositProcessor
                status: 201
                security: "is_granted('ROLE_USER')"
            execute_deposit:
                class: ApiPlatform\Metadata\Post
                uriTemplate: /transactions/execute-deposit
                input: App\Dto\ExecuteDepositInput
                output: App\Dto\TransactionResponse
                processor: App\State\DepositProcessor
                status: 201
                security: "is_granted('ROLE_USER')"
            init_withdrawal:
                class: ApiPlatform\Metadata\Post
                uriTemplate: /transactions/init-withdrawal
                input: App\Dto\InitWithdrawalInput
                output: App\Dto\TransactionResponse
                processor: App\State\WithdrawalProcessor
                status: 201
                security: "is_granted('ROLE_USER')"
            execute_withdrawal:
                class: ApiPlatform\Metadata\Post
                uriTemplate: /transactions/execute-withdrawal
                input: App\Dto\ExecuteWithdrawalInput
                output: App\Dto\TransactionResponse
                processor: App\State\WithdrawalProcessor
                status: 201
                security: "is_granted('ROLE_USER')"
            init_transfer:
                class: ApiPlatform\Metadata\Post
                uriTemplate: /transactions/init-transfer
                input: App\Dto\InitTransferInput
                output: App\Dto\TransactionResponse
                processor: App\State\TransferProcessor
                status: 201
                security: "is_granted('ROLE_USER')"
            execute_transfer:
                class: ApiPlatform\Metadata\Post
                uriTemplate: /transactions/execute-transfer
                input: App\Dto\ExecuteTransferInput
                output: App\Dto\TransactionResponse
                processor: App\State\TransferProcessor
                status: 201
                security: "is_granted('ROLE_USER')"
            init_multi_transfer:
                class: ApiPlatform\Metadata\Post
                uriTemplate: /transactions/init-multi-transfer
                input: App\Dto\InitMultiTransferInput
                output: App\Dto\TransactionResponse
                processor: App\State\TransferProcessor
                status: 201
                security: "is_granted('ROLE_USER')"
            execute_multi_transfer:
                class: ApiPlatform\Metadata\Post
                uriTemplate: /transactions/execute-multi-transfer
                input: App\Dto\ExecuteMultiTransferInput
                output: App\Dto\TransactionResponse
                processor: App\State\TransferProcessor
                status: 201
                security: "is_granted('ROLE_USER')"

